# Checks every week for code libraries with known security problems and opens a pull request
# with the fix. Nothing goes live until the owner (or Claude) merges it and the checks pass.
# Big version jumps (major versions) are skipped here: they can change how things work and are
# done by hand. Security fixes still arrive for every version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
