# Checks every week for code libraries with known security problems and opens a pull request
# with the fix. Nothing goes live until the owner (or Claude) merges it and the checks pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
